name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Route types (PageProps, LayoutProps, RouteContext) are generated, not committed.
      - run: pnpm --filter web exec next typegen
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3700
